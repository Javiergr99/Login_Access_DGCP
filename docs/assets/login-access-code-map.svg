<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Organización del código de Login Access</title>
  <desc id="desc">Mapa visual de las capas principales del frontend: app, components, features, shared y api.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".30"/>
    </filter>
  </defs>

  <rect width="1400" height="560" rx="26" fill="url(#bg)"/>

  <text x="58" y="66" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="30" font-weight="800">Mapa del código</text>
  <text x="58" y="98" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="15">Organización por responsabilidad, dominio y reutilización</text>

  <g filter="url(#shadow)">
    <rect x="545" y="130" width="310" height="84" rx="22" fill="url(#root)"/>
    <text x="700" y="166" text-anchor="middle" fill="#fff"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">src/</text>
    <text x="700" y="191" text-anchor="middle" fill="#e0e7ff"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">entrada del frontend</text>
  </g>

  <!-- connectors -->
  <path d="M700 214V250" stroke="#475569" stroke-width="2"/>
  <path d="M170 250H1230" stroke="#475569" stroke-width="2"/>
  <path d="M170 250V278M435 250V278M700 250V278M965 250V278M1230 250V278"
        stroke="#475569" stroke-width="2"/>

  <!-- cards -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g>
      <rect x="55" y="278" width="230" height="180" rx="20" fill="#111c2d" stroke="#28415f"/>
      <circle cx="84" cy="310" r="8" fill="#22d3ee"/>
      <text x="104" y="316" fill="#fff" font-size="18" font-weight="800">api/</text>
      <text x="76" y="352" fill="#cbd5e1" font-size="13">Cliente HTTP</text>
      <text x="76" y="378" fill="#94a3b8" font-size="12">• errores normalizados</text>
      <text x="76" y="401" fill="#94a3b8" font-size="12">• interceptores</text>
      <text x="76" y="424" fill="#94a3b8" font-size="12">• autenticación remota</text>
    </g>

    <g>
      <rect x="320" y="278" width="230" height="180" rx="20" fill="#111c2d" stroke="#3f3a66"/>
      <circle cx="349" cy="310" r="8" fill="#a78bfa"/>
      <text x="369" y="316" fill="#fff" font-size="18" font-weight="800">app/</text>
      <text x="341" y="352" fill="#cbd5e1" font-size="13">Composición global</text>
      <text x="341" y="378" fill="#94a3b8" font-size="12">• providers</text>
      <text x="341" y="401" fill="#94a3b8" font-size="12">• router</text>
      <text x="341" y="424" fill="#94a3b8" font-size="12">• estilos y tokens</text>
    </g>

    <g>
      <rect x="585" y="278" width="230" height="180" rx="20" fill="#111c2d" stroke="#285646"/>
      <circle cx="614" cy="310" r="8" fill="#34d399"/>
      <text x="634" y="316" fill="#fff" font-size="18" font-weight="800">features/</text>
      <text x="606" y="352" fill="#cbd5e1" font-size="13">Dominios funcionales</text>
      <text x="606" y="378" fill="#94a3b8" font-size="12">• auth</text>
      <text x="606" y="401" fill="#94a3b8" font-size="12">• access</text>
      <text x="606" y="424" fill="#94a3b8" font-size="12">• profile</text>
    </g>

    <g>
      <rect x="850" y="278" width="230" height="180" rx="20" fill="#111c2d" stroke="#5e4623"/>
      <circle cx="879" cy="310" r="8" fill="#f59e0b"/>
      <text x="899" y="316" fill="#fff" font-size="18" font-weight="800">components/</text>
      <text x="871" y="352" fill="#cbd5e1" font-size="13">UI reutilizable</text>
      <text x="871" y="378" fill="#94a3b8" font-size="12">• layout</text>
      <text x="871" y="401" fill="#94a3b8" font-size="12">• primitives</text>
      <text x="871" y="424" fill="#94a3b8" font-size="12">• componentes base</text>
    </g>

    <g>
      <rect x="1115" y="278" width="230" height="180" rx="20" fill="#111c2d" stroke="#5a3045"/>
      <circle cx="1144" cy="310" r="8" fill="#fb7185"/>
      <text x="1164" y="316" fill="#fff" font-size="18" font-weight="800">shared/</text>
      <text x="1136" y="352" fill="#cbd5e1" font-size="13">Infraestructura común</text>
      <text x="1136" y="378" fill="#94a3b8" font-size="12">• config y constants</text>
      <text x="1136" y="401" fill="#94a3b8" font-size="12">• hooks y lib</text>
      <text x="1136" y="424" fill="#94a3b8" font-size="12">• navigation y theme</text>
    </g>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">
    <rect x="422" y="492" width="150" height="32" rx="16" fill="#0f2435" stroke="#164e63"/>
    <text x="497" y="513" text-anchor="middle" fill="#67e8f9">DOMINIO</text>

    <rect x="587" y="492" width="150" height="32" rx="16" fill="#1f1837" stroke="#5b4ca0"/>
    <text x="662" y="513" text-anchor="middle" fill="#c4b5fd">TIPADO</text>

    <rect x="752" y="492" width="150" height="32" rx="16" fill="#10291f" stroke="#236345"/>
    <text x="827" y="513" text-anchor="middle" fill="#6ee7b7">TESTABILIDAD</text>
  </g>
</svg>
