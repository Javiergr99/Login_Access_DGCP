<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Login Access — Ecosistema Integral DGCP</title>
  <desc id="desc">Banner del frontend central de autenticación, MFA y distribución de accesos.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="50%" stop-color="#111c3d"/>
      <stop offset="100%" stop-color="#2b1645"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="52%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity=".30"/>
    </filter>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="390" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="26" fill="url(#grid)"/>
  <rect x="0" y="382" width="1200" height="8" fill="url(#accent)"/>

  <g transform="translate(62 62)">
    <rect width="64" height="64" rx="18" fill="url(#iconBg)" filter="url(#shadow)"/>
    <path d="M32 15l13 5v9c0 9-5.4 16.7-13 20-7.6-3.3-13-11-13-20v-9l13-5z"
      fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M27 32l4 4 7-8" fill="none" stroke="#fff" stroke-width="3.5"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="148" y="84" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="16" font-weight="700" letter-spacing="2.2">PLATAFORMA INSTITUCIONAL</text>

  <text x="62" y="181" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="58" font-weight="800">Login Access</text>

  <text x="64" y="219" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="19">Autenticación centralizada, MFA y acceso seguro al ecosistema.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">
    <g transform="translate(64 262)">
      <rect width="142" height="38" rx="19" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="18" cy="19" r="5" fill="#22d3ee"/>
      <text x="32" y="24" fill="#e2e8f0">MFA / TOTP</text>
    </g>

    <g transform="translate(219 262)">
      <rect width="182" height="38" rx="19" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="18" cy="19" r="5" fill="#34d399"/>
      <text x="32" y="24" fill="#e2e8f0">Permisos por usuario</text>
    </g>

    <g transform="translate(414 262)">
      <rect width="164" height="38" rx="19" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="18" cy="19" r="5" fill="#c4b5fd"/>
      <text x="32" y="24" fill="#e2e8f0">Redirect-code</text>
    </g>
  </g>

  <g transform="translate(770 55)" filter="url(#shadow)">
    <rect width="350" height="280" rx="30" fill="#ffffff" fill-opacity=".075"
      stroke="#ffffff" stroke-opacity=".14"/>

    <rect x="26" y="25" width="298" height="56" rx="14" fill="#ffffff" fill-opacity=".10"/>
    <circle cx="50" cy="53" r="9" fill="#3b82f6"/>
    <rect x="72" y="42" width="98" height="9" rx="4.5" fill="#e2e8f0" fill-opacity=".85"/>
    <rect x="72" y="58" width="62" height="7" rx="3.5" fill="#94a3b8" fill-opacity=".70"/>

    <g transform="translate(26 102)">
      <rect width="142" height="64" rx="14" fill="#ffffff" fill-opacity=".09"/>
      <rect x="16" y="17" width="38" height="7" rx="3.5" fill="#67e8f9"/>
      <rect x="16" y="34" width="76" height="7" rx="3.5" fill="#cbd5e1"/>
    </g>

    <g transform="translate(182 102)">
      <rect width="142" height="64" rx="14" fill="#ffffff" fill-opacity=".09"/>
      <rect x="16" y="17" width="38" height="7" rx="3.5" fill="#c4b5fd"/>
      <rect x="16" y="34" width="76" height="7" rx="3.5" fill="#cbd5e1"/>
    </g>

    <rect x="26" y="184" width="298" height="68" rx="14" fill="#ffffff" fill-opacity=".09"/>
    <path d="M49 219l10 10 18-22" fill="none" stroke="#34d399" stroke-width="4"
      stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="92" y="205" width="125" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="92" y="222" width="180" height="7" rx="3.5" fill="#94a3b8" fill-opacity=".75"/>
  </g>
</svg>
